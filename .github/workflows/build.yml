
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v5

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair projeto
        run: unzip -q ZerounAutomed.zip

      - name: Compilar APK
        working-directory: ZerounAutomed
        run: gradle assembleDebug --no-daemon

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: ZEROUN-AUTOMED-apk
          path: ZerounAutomed/app/build/outputs/apk/debug/app-debug.apk
