
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Extrair ZIP
        run: unzip -q ZerounAutomed.zip

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon
        working-directory: ZerounAutomed

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: ZEROUN-AUTOMED-apk
          path: ZerounAutomed/app/build/outputs/apk/debug/app-debug.apk
